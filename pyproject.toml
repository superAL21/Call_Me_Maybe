[project]
name = "call-me-maybe"
version = "1.5.0"
description = "function function calling in LLMs with constrained decoding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.12.5",
    "numpy>=2.2.6",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
]

[dependency-groups]
dev = [
  	"mypy>=1.19.1",
    "flake8>=7.3.0",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.flake8]
max-line-length = 88
exclude = [
  ".venv",
  "__pycache__",
  ".mypy_cache",
  ".pytest_cache",
]